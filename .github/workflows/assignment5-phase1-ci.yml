name: Assignment 5 Phase 1 CI

on:
  push:
    paths:
      - "assignment5/phase1/**"
      - ".github/workflows/assignment5-phase1-ci.yml"
  pull_request:
    paths:
      - "assignment5/phase1/**"
      - ".github/workflows/assignment5-phase1-ci.yml"

defaults:
  run:
    working-directory: assignment5/phase1

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5433:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tubedeck_phase1_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/tubedeck_phase1_ci
      DIRECT_URL: postgresql://postgres:postgres@localhost:5433/tubedeck_phase1_ci
      SESSION_SECRET: ci-test-session-secret-min-32-characters

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: assignment5/phase1/package-lock.json
      - name: Install
        run: npm ci
      - name: Prisma migrate
        run: npx prisma migrate deploy
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
