<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Tracker — Assignment 4 client</title>
  </head>
  <body>
    <main class="wrap">
      <h1>Task Tracker (generated SDK)</h1>
      <p class="hint">
        OpenAPI Generator <code>typescript-fetch</code> — no raw
        <code>fetch</code> in app code.
      </p>
      <section class="actions">
        <button id="btn-list" type="button">List tasks</button>
        <button id="btn-create" type="button">Create demo task</button>
        <div class="row">
          <input
            id="delete-id"
            type="text"
            placeholder="task id to delete"
            aria-label="Task id to delete"
          />
          <button id="btn-delete" type="button">Delete</button>
        </div>
        <button id="btn-stats" type="button">Stats (custom)</button>
      </section>
      <pre id="output" class="out" aria-live="polite"></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
