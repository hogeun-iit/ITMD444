<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Tracker</title>
  </head>
  <body>
    <main class="wrap">
      <h1>Task Tracker</h1>

      <div id="status-msg" class="status-msg" role="status" aria-live="polite"></div>

      <section class="panel" aria-labelledby="stats-heading">
        <h2 id="stats-heading">Statistics</h2>
        <button type="button" id="btn-refresh-stats">Refresh stats</button>
        <dl class="stats-grid" id="stats-display">
          <div><dt>Total tasks</dt><dd id="stat-total">—</dd></div>
          <div><dt>Completed</dt><dd id="stat-done">—</dd></div>
          <div><dt>Overdue (not done)</dt><dd id="stat-overdue">—</dd></div>
          <div><dt>Avg. estimate (h)</dt><dd id="stat-avg">—</dd></div>
          <div><dt>TODO / In progress / Done</dt><dd id="stat-by-status">—</dd></div>
        </dl>
      </section>

      <section class="panel" aria-labelledby="create-heading">
        <h2 id="create-heading">New task</h2>
        <form id="form-create" class="form-grid">
          <label>Title <input name="title" type="text" required minlength="1" /></label>
          <label>Assignee <input name="assignee" type="text" required minlength="1" /></label>
          <label
            >Status
            <select name="status" required>
              <option value="TODO">TODO</option>
              <option value="IN_PROGRESS">In progress</option>
              <option value="DONE">Done</option>
            </select>
          </label>
          <label
            >Priority
            <select name="priority" required>
              <option value="LOW">Low</option>
              <option value="MEDIUM" selected>Medium</option>
              <option value="HIGH">High</option>
            </select>
          </label>
          <label
            >Estimate (hours)
            <input name="estimateHours" type="number" min="1" step="1" value="4" required
          /></label>
          <label
            >Due date
            <input
              name="dueDate"
              type="text"
              required
              placeholder="YYYY-MM-DD"
              pattern="\d{4}-\d{2}-\d{2}"
              maxlength="10"
              autocomplete="off"
              title="Format: YYYY-MM-DD"
            />
          </label>
          <div class="form-actions">
            <button type="submit">Create task</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="list-heading">
        <h2 id="list-heading">All tasks</h2>
        <button type="button" id="btn-refresh-list">Refresh list</button>
        <div class="table-wrap">
          <table class="tasks-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Assignee</th>
                <th>Status</th>
                <th>Priority</th>
                <th>Due</th>
                <th>Hours</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tasks-tbody"></tbody>
          </table>
        </div>
        <p id="tasks-empty" class="empty-hint hidden">No tasks yet. Create one above or refresh.</p>
      </section>

      <section class="panel hidden" id="detail-panel" aria-labelledby="detail-heading">
        <h2 id="detail-heading">Edit task</h2>
        <form id="form-edit" class="form-grid">
          <label>Title <input name="title" type="text" required minlength="1" /></label>
          <label>Assignee <input name="assignee" type="text" required minlength="1" /></label>
          <label
            >Status
            <select name="status" required>
              <option value="TODO">TODO</option>
              <option value="IN_PROGRESS">In progress</option>
              <option value="DONE">Done</option>
            </select>
          </label>
          <label
            >Priority
            <select name="priority" required>
              <option value="LOW">Low</option>
              <option value="MEDIUM">Medium</option>
              <option value="HIGH">High</option>
            </select>
          </label>
          <label
            >Estimate (hours)
            <input name="estimateHours" type="number" min="1" step="1" required
          /></label>
          <label
            >Due date
            <input
              name="dueDate"
              type="text"
              required
              placeholder="YYYY-MM-DD"
              pattern="\d{4}-\d{2}-\d{2}"
              maxlength="10"
              autocomplete="off"
              title="Format: YYYY-MM-DD"
            />
          </label>
          <div class="form-actions">
            <button type="submit">Save changes</button>
            <button type="button" id="btn-delete-selected" class="btn-danger">Delete task</button>
            <button type="button" id="btn-close-detail">Close</button>
          </div>
        </form>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
